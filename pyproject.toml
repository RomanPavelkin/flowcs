[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flowcs"
version = "0.1.0"
description = "Flow-Based Generative Modeling for Optimizing Sampling Policies in Compressed Sensing Applications"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "torchdiffeq>=0.2.3",
    "numpy>=1.23",
    "matplotlib>=3.6",
    "scikit-learn>=1.1",
    "scikit-image>=0.19",
    "h5py>=3.7",
    "fastmri>=0.3.0",
    "torchmetrics>=0.11",
    "Pillow>=9.0",
]

[tool.setuptools.packages.find]
where = ["src"]
